<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>سوقنا — سوق محلي للبيع والشراء</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <span class="logo">سوقنا</span>
  <nav>
    <button class="nav-btn active" id="navHome">الرئيسية</button>
  </nav>
</header>

<main id="pageHome">
  <div class="hero">
    <h1>سوق حيّك، بين يديك</h1>
    <p>تصفّح السلع المتاحة في منطقتك وتواصل مع البائع مباشرة عبر واتساب.</p>
  </div>

  <div class="search-row">
    <input type="text" id="searchInput" placeholder="ابحث عن سلعة (مثال: هاتف، طاولة...)" oninput="renderGrid()">
    <button aria-label="بحث" onclick="renderGrid()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    </button>
  </div>

  <div class="chips" id="chips"></div>

  <div class="controls-row">
    <select class="sort-select" id="sortSelect" onchange="renderGrid()">
      <option value="newest">الأحدث أولاً</option>
      <option value="lowest">الأقل سعرًا</option>
      <option value="highest">الأعلى سعرًا</option>
    </select>
    <button class="fav-toggle" id="favToggle" onclick="toggleFavView()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-4.35-9.5-8.5C.7 9 2 5.5 5.5 5c2-.3 3.6.7 4.5 2.2C10.9 5.7 12.5 4.7 14.5 5c3.5.5 4.8 4 3 7.5C19 16.65 12 21 12 21z"></path></svg>
      المفضلة فقط
    </button>
  </div>

  <div id="grid">
    <div class="grid-loader">
      <div class="loading-spinner"></div>
      <div>جاري تحميل السلع...</div>
    </div>
  </div>
</main>

<main id="pageDetail" class="hidden">
  <div class="detail-wrap">
    <button class="back-btn" onclick="showPage('home')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      رجوع للسلع
    </button>
    <div class="detail-card">
      <div class="detail-img" id="detailImg">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="8.5" cy="10.5" r="1.5"></circle><path d="M21 15l-5-5-9 9"></path></svg>
      </div>
      <div class="detail-body">
        <div class="detail-title" id="detailTitle"></div>
        <div class="detail-price" id="detailPrice"></div>
        <div class="detail-meta">
          <span id="detailLoc">📍 غير محدد</span>
          <span id="detailCat">🏷️ أخرى</span>
        </div>
        <div class="detail-desc" id="detailDesc"></div>
        <div class="detail-actions">
          <button class="contact-btn" id="contactBtn">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 3.5A11.8 11.8 0 0012 0C5.4 0 0 5.4 0 12c0 2.1.5 4.1 1.6 5.9L0 24l6.3-1.6A12 12 0 0012 24c6.6 0 12-5.4 12-12 0-3.2-1.3-6.2-3.5-8.5zM12 22c-1.9 0-3.7-.5-5.3-1.5l-.4-.2-3.8 1 1-3.7-.2-.4A9.9 9.9 0 012 12C2 6.5 6.5 2 12 2s10 4.5 10 10-4.5 10-10 10z"></path></svg>
            تواصل عبر واتساب
          </button>
          <button class="action-btn" id="detailFavBtn" onclick="toggleFavoriteCurrent()" title="إضافة للمفضلة">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-4.35-9.5-8.5C.7 9 2 5.5 5.5 5c2-.3 3.6.7 4.5 2.2C10.9 5.7 12.5 4.7 14.5 5c3.5.5 4.8 4 3 7.5C19 16.65 12 21 12 21z"></path></svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</main>

<footer>
  <div>سوقنا © 2026 — سوق محلي يربطك بأهل منطقتك</div>
</footer>

<script type="module" src="firebase.js"></script>
<script src="app.js"></script>
</body>
</html>
